
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="refresh" content="3;url=../../index.html">

    <title>CCN - Cadastro concluído</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background: #000a75;
        }

        body {
            max-width: 520px;
            margin: 40px auto;
            padding: 40px 44px 44px;
            background: #fff;
            border-radius: 16px;
            font-family: "Open Sans", Arial, sans-serif;
            color: #0a0aa8;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }

        h2 {
            text-align: center;
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 55px;
            background: linear-gradient(90deg, #0a3a7a, #1fb5a8, #5b1f8a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #000a75;
            margin-bottom: 25px;
        }

        p {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        @media (max-width: 560px) {
            body {
                margin: 16px;
                padding: 32px 22px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <h2>CCN</h2>

    <h1>Cadastro concluído!</h1>

    <p>Os dados da empresa foram cadastrados com sucesso.</p>

    <p>Você será redirecionado para o login...</p>

</body>
</html>
