
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCN - CEP</title>

    <style>
        /* CONFIGURAÇÕES GERAIS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background: #000a75;
        }

        body {
            max-width: 520px;
            margin: 40px auto;
            padding: 40px 44px 44px;
            background: #fff;
            border-radius: 16px;
            font-family: "Open Sans", Arial, sans-serif;
            color: #0a0aa8;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }

        a {
            text-decoration: none;
        }

        /* LOGO */
        h2 {
            text-align: center;
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 45px;
            background: linear-gradient(90deg, #0a3a7a 0%, #1fb5a8 50%, #5b1f8a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ETAPAS */
        .etapas {
            display: flex;
            align-items: center;
            margin-bottom: 55px;
        }

        .etapas span {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #c9ccff;
            border-radius: 50%;
            font-size: 16px;
            font-weight: 600;
            color: #0a0aa8;
            background: #fff;
        }

        .etapas span.ativo {
            background: #0000ff;
            border-color: #0000ff;
            color: #fff;
            box-shadow: 0 0 0 5px rgba(0, 0, 255, 0.15);
        }

        .etapas i {
            flex: 1;
            height: 2px;
            background: #dfe2ff;
        }

        /* TÍTULO */
        h1 {
            font-size: 36px;
            font-weight: 600;
            color: #000a75;
            margin-bottom: 35px;
        }

        /* PERGUNTA */
        p {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        /* CAMPO CEP */
        input {
            width: 100%;
            height: 60px;
            padding: 0 20px;
            border: 1px solid #c9ccff;
            border-radius: 10px;
            background: #fff;
            font-family: inherit;
            font-size: 17px;
            color: #000a75;
            outline: none;
            transition: 0.2s;
        }

        input::placeholder {
            color: #9999c9;
        }

        input:focus {
            border-color: #0000ff;
            box-shadow: 0 0 0 3px rgba(0, 0, 255, 0.15);
        }

        /* BOTÕES */
        .botoes {
            display: flex;
            gap: 16px;
            margin-top: 45px;
        }

        .botoes a {
            flex: 1;
        }

        button {
            width: 100%;
            height: 60px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        /* ANTERIOR */
        .botoes a:first-child button {
            background: #fff;
            color: #0a0aa8;
            border: 1px solid #0000ff;
        }

        /* PRÓXIMO */
        .botoes a:last-child button {
            background: #0000ff;
            color: #fff;
            border: 1px solid #0000ff;
        }

        /* CELULAR */
        @media (max-width: 560px) {
            body {
                margin: 16px;
                padding: 32px 22px;
                min-height: auto;
            }

            h1 {
                font-size: 28px;
            }

            .etapas span {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }

            .botoes {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <h2>CCN</h2>

    <div class="etapas">
        <span>1</span><i></i>
        <span>2</span><i></i>
        <span>3</span><i></i>
        <span class="ativo">4</span><i></i>
        <span>5</span><i></i>
        <span>6</span><i></i>
        <span>7</span>
    </div>

    <h1>Seus Dados</h1>

    <p>Qual o email da empresa?</p>

    <input type="text" placeholder="Digite aqui" maxlength="9">

    <div class="botoes">

        <a href="segmento.html">
            <button type="button">Anterior</button>
        </a>

        <a href="verificacao_emailEMP.html">
            <button type="button">Próximo</button>
        </a>

    </div>

</body>
</html>
