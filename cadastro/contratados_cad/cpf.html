

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CCN - CPF</title>

<link rel="stylesheet" href="cpf.css">

</head>

<body>

<h2>CCN</h2>



<h1>Informe seu CPF</h1>
<p>Para começar seu cadastro, informe seu CPF.</p>

<label>CPF</label>
<input type="text" 
placeholder="000.000.000-00"
maxlength="11"
inputmode="numeric"
oninput="this.value = this.value.replace(/\D/g, '')">

<a href="nome.html">
    <button>Próximo</button>
</a>

</body>
</html>
