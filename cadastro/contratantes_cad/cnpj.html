<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCN - CNPJ</title>

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        /* ===== BASE (mesmo fundo azul do site) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background: #000a75;
        }

        /* o body vira o "cartão" branco, como o header do site */
        body {
            position: relative;
            max-width: 520px;
            margin: 40px auto;
            padding: 40px 44px 44px;
            background: #fff;
            border-radius: 16px;
            font-family: "Open Sans", Arial, sans-serif;
            color: #0a0aa8;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }

        a {
            text-decoration: none;
        }

        /* ===== SETA DE VOLTAR (primeiro link) ===== */
        

     

        /* ===== LOGO ===== */
        h2 {
            text-align: center;
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 28px;
            background: linear-gradient(90deg, #0a3a7a 0%, #1fb5a8 50%, #5b1f8a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ===== ETAPAS ===== */
        .etapas {
            display: flex;
            align-items: center;
            margin-bottom: 36px;
        }

        .etapas span {
            width: 30px;
            height: 30px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #c9ccff;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 600;
            color: #0a0aa8;
            background: #fff;
        }

        .etapas span.ativo {
            background: #0000ff;
            border-color: #0000ff;
            color: #fff;
            box-shadow: 0 0 0 4px rgba(0, 0, 255, 0.15);
        }

        .etapas i {
            flex: 1;
            height: 2px;
            background: #dfe2ff;
        }

        /* ===== TÍTULO E TEXTO ===== */
        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #000a75;
            margin-bottom: 24px;
        }

        p {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        /* ===== CAMPO ===== */
        input {
            width: 100%;
            height: 50px;
            padding: 0 16px;
            border: 1px solid #c9ccff;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            color: #000a75;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #9a9fd6;
        }

        input:focus {
            border-color: #0000ff;
            box-shadow: 0 0 0 3px rgba(0, 0, 255, 0.15);
        }

        br {
            display: none;
        }

        /* ===== BOTÕES (lado a lado) ===== */
        a:has(button) {
            display: inline-block;
            width: calc(50% - 0.6rem);
            margin-top: 32px;
        }

        a:has(button):nth-of-type(2) {
            margin-right: 1rem;
        }

        button {
            width: 100%;
            height: 44px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        /* Anterior: contornado, igual ao botão "Entrar" */
        a:nth-of-type(1) button {
            background: #fff;
            color: #0a0aa8;
            border: 1px solid #0a0aff;
        }

        /* Próximo: azul cheio, igual ao "Cadastre-se" */
        a:nth-of-type(2) button {
            background: #0000ff;
            color: #fff;
            border: 1px solid #0000ff;
        }

        /* ===== CELULAR ===== */
        @media (max-width: 560px) {
            body {
                margin: 16px;
                padding: 32px 22px 28px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>



<h2>CCN</h2>

<div class="etapas">
    <span>1</span><i></i>
    <span class="ativo">2</span><i></i>
    <span>3</span><i></i>
    <span>4</span><i></i>
    <span>5</span><i></i>
    <span>6</span><i></i>
    <span>7</span>
</div>

<h1>Seus Dados</h1>

<p>Qual é o CNPJ?</p>

<input type="text" placeholder="Digite aqui">

<br>

<a href="nome-empresa.html">
    <button>Anterior</button>
</a>

<a href="segmento.html">
    <button>Próximo</button>
</a>

</body>
</html>
