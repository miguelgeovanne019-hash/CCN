
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCN - Verificação do e-mail</title>

    <style>
        /* CONFIGURAÇÕES GERAIS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background: #000a75;
        }

    body {
            max-width: 520px;
            margin: 40px auto;
            padding: 40px 44px 44px;
            background: #fff;
            border-radius: 16px;
            font-family: "Open Sans", Arial, sans-serif;
            color: #0a0aa8;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }

        a {
            text-decoration: none;
        }

        /* LOGO */
        h2 {
            text-align: center;
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 45px;
            background: linear-gradient(90deg, #0a3a7a 0%, #1fb5a8 50%, #5b1f8a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ETAPAS */
        .etapas {
            display: flex;
            align-items: center;
            margin-bottom: 45px;
        }

        .etapas span {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #c9ccff;
            border-radius: 50%;
            font-size: 16px;
            font-weight: 600;
            color: #0a0aa8;
            background: #fff;
        }

        .etapas span.ativo {
            background: #0000ff;
            border-color: #0000ff;
            color: #fff;
            box-shadow: 0 0 0 5px rgba(0, 0, 255, 0.15);
        }

        .etapas i {
            flex: 1;
            height: 2px;
            background: #dfe2ff;
        }

        /* TÍTULO */
        h1 {
            font-size: 36px;
            font-weight: 600;
            color: #000a75;
            margin-bottom: 25px;
        }

        /* TEXTOS */
        p {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        p b {
            font-weight: 700;
        }

        /* CÓDIGO */
        .codigo {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 22px;
        }

        .codigo input {
            width: 55px;
            height: 60px;
            border: 1px solid #c9ccff;
            border-radius: 10px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #000a75;
            outline: none;
            transition: 0.2s;
        }

        .codigo input:focus {
            border-color: #0000ff;
            box-shadow: 0 0 0 3px rgba(0, 0, 255, 0.15);
        }

        /* REENVIAR CÓDIGO */
        .reenviar {
            display: inline-block;
            margin-top: 25px;
            font-size: 14px;
            color: #0000ff;
        }

        .reenviar:hover {
            text-decoration: underline;
        }

        /* BOTÕES */
        .botoes {
            display: flex;
            gap: 16px;
            margin-top: 35px;
        }

        .botoes a {
            flex: 1;
        }

        button {
            width: 100%;
            height: 50px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        /* ANTERIOR */
        .botoes a:first-child button {
            background: #fff;
            color: #0a0aa8;
            border: 1px solid #0000ff;
        }

        /* PRÓXIMO */
        .botoes a:last-child button {
            background: #0000ff;
            color: #fff;
            border: 1px solid #0000ff;
        }

        /* CELULAR */
        @media (max-width: 560px) {
            body {
                margin: 16px;
                padding: 32px 22px;
                min-height: auto;
            }

            h1 {
                font-size: 28px;
            }

            .etapas span {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }

            .codigo {
                gap: 6px;
            }

            .codigo input {
                width: 100%;
                min-width: 0;
                height: 50px;
            }

            .botoes {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <h2>CCN</h2>

    <div class="etapas">
        <span>1</span><i></i>
        <span>2</span><i></i>
        <span>3</span><i></i>
        <span>4</span><i></i>
        <span class="ativo">5</span><i></i>
        <span>6</span><i></i>
        <span>7</span>
    </div>

    <h1>Seus Dados</h1>

    <p>Enviamos um código de verificação para o e-mail da empresa.</p>

    <p><b>Digite o código recebido:</b></p>

    <div class="codigo">
        <input type="text" maxlength="1" inputmode="numeric">
        <input type="text" maxlength="1" inputmode="numeric">
        <input type="text" maxlength="1" inputmode="numeric">
        <input type="text" maxlength="1" inputmode="numeric">
        <input type="text" maxlength="1" inputmode="numeric">
        <input type="text" maxlength="1" inputmode="numeric">
    </div>

    <a href="#" class="reenviar">Não recebeu o código? Reenviar</a>

    <div class="botoes">

        <a href="email.html">
            <button type="button">Anterior</button>
        </a>

        <a href="celular_empresa.html">
            <button type="button">Próximo</button>
        </a>

    </div>

</body>
</html>
